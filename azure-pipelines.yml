# Azure DevOps Multi-Stage Terraform Pipeline configured for MAIN branch
# Workflow DAG: [tflint, tfsec, Infracost, Gitleaks] -> Init&Validate -> Plan -> Manual Approval -> Apply

parameters:
  - name: agentPool
    displayName: "Agent Pool Name"
    type: string
    default: "Ranjan_PG_Pool"

  - name: subscriptionId
    displayName: "Azure Subscription ID"
    type: string
    default: "191839a3-3fe2-4852-b995-88a675fc1f7f"

  - name: tenantId
    displayName: "Azure Tenant ID"
    type: string
    default: "2cfb7c24-f877-4676-87a8-f491f977718e"

  - name: clientId
    displayName: "Azure Client ID"
    type: string
    default: "df0cc644-f741-4a9a-a207-8d96d05204fb"

  - name: clientSecret
    displayName: "Azure Client Secret"
    type: string
    default: "$(CLIENT_SECRET)"

  - name: storageResourceGroup
    displayName: "Storage Resource Group Name"
    type: string
    default: "B18_G2_RG"

  - name: storageAccountName
    displayName: "Storage Account Name"
    type: string
    default: "b18g2storage"

  - name: containerName
    displayName: "Container Name"
    type: string
    default: "b18g2container"

  - name: tfstateKey
    displayName: "Terraform State Key"
    type: string
    default: "terraform.tfstate"

  - name: workingDirectory
    displayName: "Working Directory"
    type: string
    default: "Parent-Moudle"

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  name: Ranjan_PG_Pool

variables:
  ARM_CLIENT_ID: ${{ parameters.clientId }}
  ARM_CLIENT_SECRET: ${{ parameters.clientSecret }}
  ARM_TENANT_ID: ${{ parameters.tenantId }}
  ARM_SUBSCRIPTION_ID: ${{ parameters.subscriptionId }}
  TF_IN_AUTOMATION: "true"
  CHECKPOINT_DISABLE: "1"

stages:
  # -------------------------------------------------------------
  # STAGE 1: tflint
  # -------------------------------------------------------------
  - stage: tflint
    displayName: "tflint"
    jobs:
      - job: tflint_job
        displayName: "Run TFLint Scan"
        steps:
          - powershell: |
              $ErrorActionPreference = "Continue"
              Write-Host "Starting TFLint Scan..."
              Set-Location "$(Build.SourcesDirectory)/${{ parameters.workingDirectory }}"
              if (Get-Command tflint -ErrorAction SilentlyContinue) {
                  try {
                      & tflint --init
                      & tflint
                  } catch {
                      Write-Host "tflint execution skipped or failed: $_"
                  }
              } else {
                  Write-Host "tflint is not installed on agent. Skipping scan step..."
              }
            displayName: "Execute tflint"
            continueOnError: true

  # -------------------------------------------------------------
  # STAGE 2: tfsec
  # -------------------------------------------------------------
  - stage: tfsec
    displayName: "tfsec"
    jobs:
      - job: tfsec_job
        displayName: "Run TFSec Security Scan"
        steps:
          - powershell: |
              $ErrorActionPreference = "Continue"
              Write-Host "Starting TFSec Scan..."
              Set-Location "$(Build.SourcesDirectory)/${{ parameters.workingDirectory }}"
              if (Get-Command tfsec -ErrorAction SilentlyContinue) {
                  try {
                      & tfsec .
                  } catch {
                      Write-Host "tfsec execution skipped or failed: $_"
                  }
              } else {
                  Write-Host "tfsec is not installed on agent. Skipping scan step..."
              }
            displayName: "Execute tfsec"
            continueOnError: true

  # -------------------------------------------------------------
  # STAGE 3: Infracost
  # -------------------------------------------------------------
  - stage: Infracost
    displayName: "Infracost"
    jobs:
      - job: infracost_job
        displayName: "Run Infracost Cost Analysis"
        steps:
          - powershell: |
              $ErrorActionPreference = "Continue"
              Write-Host "Starting Infracost Scan..."
              Set-Location "$(Build.SourcesDirectory)/${{ parameters.workingDirectory }}"
              if (Get-Command infracost -ErrorAction SilentlyContinue) {
                  try {
                      & infracost breakdown --path .
                  } catch {
                      Write-Host "infracost execution skipped or failed: $_"
                  }
              } else {
                  Write-Host "infracost is not installed on agent. Skipping cost analysis step..."
              }
            displayName: "Execute Infracost"
            continueOnError: true

  # -------------------------------------------------------------
  # STAGE 4: Gitleaks
  # -------------------------------------------------------------
  - stage: Gitleaks
    displayName: "Gitleaks"
    jobs:
      - job: gitleaks_job
        displayName: "Run Gitleaks Secret Scan"
        steps:
          - powershell: |
              $ErrorActionPreference = "Continue"
              Write-Host "Starting Gitleaks Scan..."
              Set-Location "$(Build.SourcesDirectory)"
              if (Get-Command gitleaks -ErrorAction SilentlyContinue) {
                  try {
                      & gitleaks detect --source=. --verbose
                  } catch {
                      Write-Host "gitleaks execution skipped or failed: $_"
                  }
              } else {
                  Write-Host "gitleaks is not installed on agent. Skipping secret scan step..."
              }
            displayName: "Execute Gitleaks"
            continueOnError: true

  # -------------------------------------------------------------
  # STAGE 5: Init&Validate
  # -------------------------------------------------------------
  - stage: Init_Validate
    displayName: "Init&Validate"
    dependsOn:
      - tflint
      - tfsec
      - Infracost
      - Gitleaks
    condition: succeededOrFailed()
    jobs:
      - job: init_validate_job
        displayName: "Terraform Init & Validate"
        steps:
          - powershell: |
              Write-Host "Initializing Terraform backend and validating configurations..."
              Set-Location "$(Build.SourcesDirectory)/${{ parameters.workingDirectory }}"
              $env:ARM_CLIENT_ID="${{ parameters.clientId }}"
              $env:ARM_CLIENT_SECRET="$(CLIENT_SECRET)"
              $env:ARM_TENANT_ID="${{ parameters.tenantId }}"
              $env:ARM_SUBSCRIPTION_ID="${{ parameters.subscriptionId }}"
              $env:TF_IN_AUTOMATION="1"
              $env:CHECKPOINT_DISABLE="1"

              $maxRetries = 3
              $retryCount = 0
              $success = $false
              while (-not $success -and $retryCount -lt $maxRetries) {
                  $retryCount++
                  Write-Host "Running terraform init (Attempt $retryCount of $maxRetries)..."
                  terraform init -input=false `
                    -backend-config="resource_group_name=${{ parameters.storageResourceGroup }}" `
                    -backend-config="storage_account_name=${{ parameters.storageAccountName }}" `
                    -backend-config="container_name=${{ parameters.containerName }}" `
                    -backend-config="key=${{ parameters.tfstateKey }}" `
                    -backend-config="subscription_id=${{ parameters.subscriptionId }}" `
                    -backend-config="tenant_id=${{ parameters.tenantId }}" `
                    -backend-config="client_id=${{ parameters.clientId }}" `
                    -backend-config="client_secret=$(CLIENT_SECRET)"
                  if ($LASTEXITCODE -eq 0) {
                      $success = $true
                  } else {
                      Write-Host "Terraform init failed on attempt $retryCount. Retrying in 5 seconds..."
                      Start-Sleep -Seconds 5
                  }
              }
              if (-not $success) {
                  throw "Terraform init failed after $maxRetries attempts due to network connectivity issues."
              }

              terraform validate
            displayName: "Terraform Init and Validate"

  # -------------------------------------------------------------
  # STAGE 6: Plan
  # -------------------------------------------------------------
  - stage: Plan
    displayName: "Plan"
    dependsOn: Init_Validate
    jobs:
      - job: plan_job
        displayName: "Terraform Plan"
        steps:
          - powershell: |
              Write-Host "Executing Terraform Plan..."
              Set-Location "$(Build.SourcesDirectory)/${{ parameters.workingDirectory }}"
              $env:ARM_CLIENT_ID="${{ parameters.clientId }}"
              $env:ARM_CLIENT_SECRET="$(CLIENT_SECRET)"
              $env:ARM_TENANT_ID="${{ parameters.tenantId }}"
              $env:ARM_SUBSCRIPTION_ID="${{ parameters.subscriptionId }}"
              $env:TF_IN_AUTOMATION="1"
              $env:CHECKPOINT_DISABLE="1"

              $maxRetries = 3
              $retryCount = 0
              $success = $false
              while (-not $success -and $retryCount -lt $maxRetries) {
                  $retryCount++
                  Write-Host "Running terraform init (Attempt $retryCount of $maxRetries)..."
                  terraform init -input=false `
                    -backend-config="resource_group_name=${{ parameters.storageResourceGroup }}" `
                    -backend-config="storage_account_name=${{ parameters.storageAccountName }}" `
                    -backend-config="container_name=${{ parameters.containerName }}" `
                    -backend-config="key=${{ parameters.tfstateKey }}" `
                    -backend-config="subscription_id=${{ parameters.subscriptionId }}" `
                    -backend-config="tenant_id=${{ parameters.tenantId }}" `
                    -backend-config="client_id=${{ parameters.clientId }}" `
                    -backend-config="client_secret=$(CLIENT_SECRET)"
                  if ($LASTEXITCODE -eq 0) {
                      $success = $true
                  } else {
                      Write-Host "Terraform init failed on attempt $retryCount. Retrying in 5 seconds..."
                      Start-Sleep -Seconds 5
                  }
              }
              if (-not $success) {
                  throw "Terraform init failed after $maxRetries attempts."
              }

              terraform plan -input=false -out=tfplan
            displayName: "Terraform Plan Execution"

  # -------------------------------------------------------------
  # STAGE 7: Manual Approval
  # -------------------------------------------------------------
  - stage: Manual_Approval
    displayName: "Manual Approval"
    dependsOn: Plan
    jobs:
      - job: manual_approval_job
        displayName: "Manual Approval Gate"
        pool: server
        steps:
          - task: ManualValidation@0
            inputs:
              notifyUsers: ''
              instructions: 'Please review the terraform plan output and approve to proceed with Apply stage.'
              onTimeout: 'reject'

  # -------------------------------------------------------------
  # STAGE 8: Apply
  # -------------------------------------------------------------
  - stage: Apply
    displayName: "Apply"
    dependsOn: Manual_Approval
    condition: succeeded()
    jobs:
      - job: apply_job
        displayName: "Terraform Apply"
        steps:
          - powershell: |
              Write-Host "Executing Terraform Apply on main branch..."
              Set-Location "$(Build.SourcesDirectory)/${{ parameters.workingDirectory }}"
              $env:ARM_CLIENT_ID="${{ parameters.clientId }}"
              $env:ARM_CLIENT_SECRET="$(CLIENT_SECRET)"
              $env:ARM_TENANT_ID="${{ parameters.tenantId }}"
              $env:ARM_SUBSCRIPTION_ID="${{ parameters.subscriptionId }}"
              $env:TF_IN_AUTOMATION="1"
              $env:CHECKPOINT_DISABLE="1"

              $maxRetries = 3
              $retryCount = 0
              $success = $false
              while (-not $success -and $retryCount -lt $maxRetries) {
                  $retryCount++
                  Write-Host "Running terraform init (Attempt $retryCount of $maxRetries)..."
                  terraform init -input=false `
                    -backend-config="resource_group_name=${{ parameters.storageResourceGroup }}" `
                    -backend-config="storage_account_name=${{ parameters.storageAccountName }}" `
                    -backend-config="container_name=${{ parameters.containerName }}" `
                    -backend-config="key=${{ parameters.tfstateKey }}" `
                    -backend-config="subscription_id=${{ parameters.subscriptionId }}" `
                    -backend-config="tenant_id=${{ parameters.tenantId }}" `
                    -backend-config="client_id=${{ parameters.clientId }}" `
                    -backend-config="client_secret=$(CLIENT_SECRET)"
                  if ($LASTEXITCODE -eq 0) {
                      $success = $true
                  } else {
                      Write-Host "Terraform init failed on attempt $retryCount. Retrying in 5 seconds..."
                      Start-Sleep -Seconds 5
                  }
              }
              if (-not $success) {
                  throw "Terraform init failed after $maxRetries attempts."
              }

              terraform apply -input=false -auto-approve
            displayName: "Terraform Apply Execution"
